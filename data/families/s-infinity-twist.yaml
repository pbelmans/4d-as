name: '\(\mathrm{S}_\infty\) twist'
kind: "named"
generators: ["x_1", "x_2", "x_3", "x_4"]
quadratic: true
num_parameters: 2
hh0: [1, 8, 17]
hh_qgr: [1, 0, 14, 19]
point_scheme_dim: 0
line_scheme_dim: 1
line_scheme: 'five quartic curves'
year: 2014
slug: "s-infinity-twist"
sortkey: "2014 s-infinity-twist"
ks_rank: 2
ks_inj: true
ks_surj: false
centre_z1: 0
centre_z2: 1
centre_z3: 0
centre_z4: 2
centre_z5: 0
centre_z6: 2
centre_z7: 0
centre_z8: 3
centre_z9: 0
centre_z10: 3
normal_1: -1
normal_2: 0
parameters:
  - symbol: "β, γ"
    description: >
      With \(α = -(β + γ)/(1 + βγ)\); \(α, β, γ\) nonzero and not \(\pm 1\).
introduced:
  reference: "1502.06101"
  note: >
    Davies's 2014 PhD thesis, §6.1, Lemma 6.1.6 and equation (6.1.7).
construction: >
  A cocycle twist of Stafford's $\mathrm{S}_\infty$ by the Klein four-group.
  The surviving Sklyanin relations are twisted
  (commutators exchanged with anticommutators) and the signs in the two quadrics
  change.
relations:
  - "(x_1 x_2 - x_2 x_1) - α (x_3 x_4 - x_4 x_3)"
  - "(x_1 x_2 + x_2 x_1) - (x_3 x_4 + x_4 x_3)"
  - "(x_1 x_3 - x_3 x_1) - β (x_4 x_2 - x_2 x_4)"
  - "(x_1 x_3 + x_3 x_1) - (x_4 x_2 + x_2 x_4)"
  - "-x_1^2 + x_2^2 + x_3^2 - x_4^2"
  - "x_2^2 + ((1+α)/(1-β)) x_3^2 - ((1-α)/(1+γ)) x_4^2"
references:
  - "1502.06101"
point_scheme: '20 points counting multiplicity for the general member in characteristic zero (Davies, Proposition 6.1.19)'
centre: >
  $\dim \mathrm{Z}_2(A)=1$ for the general member in characteristic zero,
  spanned by $x_1x_4+x_4x_1+x_2x_3+x_3x_2$
  (computed over $\mathbb{Q}(\beta,\gamma)$)
code_derive:
  - "alpha = -(beta + gamma)/(1 + beta*gamma)"

# Nakayama automorphism (computed; see code/nakayama.m2)
calabi_yau: false
nakayama: '-\mathrm{id}'
nakayama_type: 'scalar'
nakayama_constant: true
homological_det: 1
nakayama_field: 'qq'
