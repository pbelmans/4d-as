parameters:
  - symbol: "α_1, α_2, β_1, β_2"
    description: >
      Four scalars, with the normalization $\alpha_2 \in \{0,1\}$ and
      regularity condition $(\alpha_1^2 + \alpha_2^2\beta_1)(\beta_1^2 + \beta_2^2\alpha_1) \neq 0$.
introduced:
  reference: "MR2580455"
  note: >
    Example 2 of Cassidy–Vancliff. Under the stated parameter conditions it is
    a regular graded skew Clifford algebra, with a one-dimensional line scheme.
    In particular, it is neither isomorphic to nor a twist of an ordinary graded
    Clifford algebra.
construction: >
  Another graded skew Clifford algebra, presented through symmetric and
  skew-symmetric relations whose quadratic corrections are multiples of the
  squares \(x_2^2, x_3^2\). It carries a \(2\)-dimensional space of central
  quadrics.
relations:
  - "x_3 x_1 + x_1 x_3 - β_2 x_2^2"
  - "x_4 x_1 + x_1 x_4 - α_2 x_3^2"
  - "x_2 x_3 - x_3 x_2"
  - "x_4^2 - x_2^2"
  - "x_4 x_2 + x_2 x_4 - x_3^2"
  - "α_1 x_3^2 + β_1 x_2^2 - x_1^2"
references:
  - "MR2580455"
point_scheme: '20 points'
centre: '\(\dim \operatorname{Z}(A)_2 = 2\)'

