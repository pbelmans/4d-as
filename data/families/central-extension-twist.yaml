introduced:
  reference: "2511.08390"
  note: >
    The family called "Central Extensions twist" in Tables 7 and 8 of
    arXiv:2511.08390. Remark 5.13 constructs it as a Zhang twist by a diagonal
    automorphism of order two of a central extension with no linear terms.
construction: >
    A Zhang twist of a central extension of a 3-dimensional Sklyanin algebra.
    Twisting changes the adjoined central generator into a normal element:
    in this presentation, $x_3$ anticommutes with $x_1, x_2, x_4$.
    Thus $x_3$ is not central, while $x_3^2$ is central.
    The resulting algebra is a twist of a central extension, not itself a
    central extension by the displayed degree-one generator.
centre: '$\dim_k \mathrm{Z}_1(A) = 0$; $x_3$ is normal and $x_3^2$ is central'
relations:
  - "x_2 x_1 + q x_1 x_2 + b x_4^2 + c_0 x_3^2"
  - "x_4 x_2 + q x_2 x_4 + b x_1^2 + c_1 x_3^2"
  - "x_1 x_4 + q x_4 x_1 + b x_2^2 + c_2 x_3^2"
  - "x_4 x_3 + x_3 x_4"
  - "x_1 x_3 + x_3 x_1"
  - "x_2 x_3 + x_3 x_2"
references:
